services:
  # ── PostgreSQL ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_secret
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d app_db" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PgBouncer ────────────────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DATABASE_URL: postgres://app_user:app_secret@postgres:5432/app_db
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_IDLE_TIMEOUT: "600"
      LISTEN_PORT: "6432"
      AUTH_TYPE: plain
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 || ss -tlnp | grep 6432" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI App ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: pgbouncer
      DATABASE_PORT: "6432"
      DATABASE_USER: app_user
      DATABASE_PASSWORD: app_secret
      DATABASE_NAME: app_db
      DB_POOL_MIN_SIZE: "2"
      DB_POOL_MAX_SIZE: "10"
      DB_STATEMENT_TIMEOUT: "5000"
      DB_IDLE_IN_TRANSACTION_TIMEOUT: "10000"
      CB_FAIL_MAX: "5"
      CB_TIMEOUT_DURATION: "30"
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: on-failure

  # ── Prometheus ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

volumes:
  pgdata:
