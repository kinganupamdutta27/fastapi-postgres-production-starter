;; PgBouncer configuration — transaction pooling mode
;; See: https://www.pgbouncer.org/config.html

[databases]
app_db = host=postgres port=5432 dbname=app_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool mode: transaction (recommended for FastAPI / async drivers)
pool_mode = transaction

;; Pool sizing
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
max_client_conn = 200

;; Timeouts
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0

;; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Admin
admin_users = app_user
stats_users = app_user
